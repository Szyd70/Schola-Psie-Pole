<!DOCTYPE html>
<html lang="pl">
<head>
  <link rel="icon" type="image/jpeg" href="IMG_20260817_103611.jpg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Śpiewnik Psie Pole</title>
  <style>
    :root {
      --bg: #0b132b;
      --card-bg: #1c2541;
      --primary: #48cae4;
      --accent: #ff0054;
      --text: #ffffff;
      --text-sub: #8d99ae;
      --border: #3a506b;
      --chords-bg: rgba(0,0,0,0.3);
    }

    [data-theme="light"] {
      --bg: #f0f4f8;
      --card-bg: #ffffff;
      --primary: #0077b6;
      --accent: #d90429;
      --text: #212529;
      --text-sub: #6c757d;
      --border: #ced4da;
      --chords-bg: rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; transition: background 0.3s, color 0.3s; }
    .container { width: 100%; max-width: 500px; }

    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { color: var(--primary); font-size: 1.8rem; }
    .banner { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; margin-bottom: 20px; }

    .btn {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--primary);
      background-color: var(--card-bg);
      color: var(--primary);
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
    }
    .btn-filled { background-color: var(--primary); color: var(--bg); }
    [data-theme="light"] .btn-filled { color: #ffffff; }
    .btn-secondary { background-color: transparent; border-color: var(--border); color: var(--text); }
    .btn-danger { border-color: var(--accent); color: var(--accent); }
    .btn-small { width: auto; padding: 6px 12px; font-size: 0.9rem; margin-bottom: 0; }

    .hidden { display: none !important; }

    .song-item, .archive-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .song-title-btn {
      background: none; border: none; color: var(--text);
      font-size: 1rem; font-weight: bold; text-align: left;
      flex-grow: 1; cursor: pointer;
    }
    .song-category { font-size: 0.75rem; color: var(--primary); display: block; margin-top: 2px; }

    .input-field {
      width: 100%; padding: 12px; margin-bottom: 12px;
      background-color: var(--card-bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; font-size: 1rem;
    }
    textarea.input-field { height: 120px; resize: vertical; }
    textarea#form-bulk-text { height: 260px; font-family: monospace; font-size: 0.9rem; }

    .nav-bar { display: flex; justify-content: space-between; margin-bottom: 15px; }

    .cat-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .cat-chip {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub);
      padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; white-space: nowrap; cursor: pointer;
    }
    .cat-chip.active { background: var(--primary); color: var(--bg); font-weight: bold; }
    [data-theme="light"] .cat-chip.active { color: #ffffff; }

    .song-lyrics { white-space: pre-wrap; font-size: 1.1rem; line-height: 1.6; margin-top: 15px; }
    .song-chords {
      white-space: pre-wrap; font-family: monospace; font-size: 1.1rem;
      color: var(--primary); background: var(--chords-bg); padding: 10px;
      border-radius: 8px; margin-top: 10px; display: none;
    }
    .controls-panel { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">

  <!-- WIDOK GŁÓWNY -->
  <div id="view-home">
    <div class="header-top">
      <h1>ŚPIEWNIK PSIE POLE</h1>
      <button class="btn btn-secondary btn-small" onclick="toggleTheme()" id="theme-btn">☀️ Jasny</button>
    </div>
    <img src="IMG_20260817_103611.jpg" class="banner" alt="Baner Śpiewnik">

    <button class="btn btn-filled" onclick="showView('view-repertuar')">📌 Repertuar</button>
    <button class="btn btn-filled" onclick="showView('view-archive')">📁 Archiwum Repertuarów</button>
    <button class="btn btn-filled" onclick="showView('view-songs')">📖 Przeglądaj Śpiewnik</button>
    <button class="btn" onclick="openAddForm()">➕ Dodaj Utwór 🔒</button>
    <button class="btn" onclick="openBulkForm()">📥 Dodaj masowo 🔒</button>
  </div>

  <!-- WIDOK PRZEGLĄDANIA ŚPIEWNIKA -->
  <div id="view-songs" class="hidden">
    <div class="nav-bar">
      <button class="btn btn-secondary btn-small" onclick="showView('view-home')">⬅️ Powrót</button>
      <h2>Śpiewnik</h2>
    </div>

    <input type="text" id="search-input" class="input-field" placeholder="🔎 Szukaj po tytule..." oninput="filterSongs()">

    <div class="cat-bar" id="categories-bar"></div>
    <div id="all-songs-list"></div>
  </div>

  <!-- WIDOK REPERTUARU -->
  <div id="view-repertuar" class="hidden">
    <div class="nav-bar">
      <button class="btn btn-secondary btn-small" onclick="showView('view-home')">⬅️ Powrót</button>
      <h2>Bieżący Repertuar</h2>
    </div>

    <div id="repertuar-list"></div>

    <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
      <input type="text" id="archive-name-input" class="input-field" placeholder="Nazwa zestawu (np. Niedziela 10:00)">
      <button class="btn btn-filled" onclick="saveRepertuarToArchive()">💾 Zapisz do Archiwum</button>
    </div>
  </div>

  <!-- WIDOK ARCHIWUM -->
  <div id="view-archive" class="hidden">
    <div class="nav-bar">
      <button class="btn btn-secondary btn-small" onclick="showView('view-home')">⬅️ Powrót</button>
      <h2>Archiwum</h2>
    </div>
    <div id="archive-list"></div>
  </div>

  <!-- WIDOK JEDNEGO UTWORU -->
  <div id="view-single" class="hidden">
    <div class="nav-bar">
      <button class="btn btn-secondary btn-small" onclick="goBackFromSong()">⬅️ Powrót</button>
      <button class="btn btn-secondary btn-small" onclick="editCurrentSong()">✏️ Edytuj 🔒</button>
    </div>

    <h2 id="view-title"></h2>
    <span id="view-category" style="color: var(--primary); font-size: 0.9rem;"></span>

    <!-- PRZYCISK OTWIERAJĄCY NAGRANIE -->
    <div id="view-audio-container" class="hidden" style="margin-top: 15px;">
      <a id="view-audio-btn" href="#" target="_blank" class="btn btn-filled" style="background-color: #2a9d8f; border-color: #2a9d8f; color: #fff; margin-bottom: 0;">
        🎵 Włącz nagranie audio
      </a>
    </div>

    <div class="controls-panel">
      <button class="btn btn-secondary btn-small" onclick="toggleChords()">🎸 Akordy</button>
      <button class="btn btn-secondary btn-small" onclick="changeFontSize(2)">A+</button>
      <button class="btn btn-secondary btn-small" onclick="changeFontSize(-2)">A-</button>
      <button class="btn btn-secondary btn-small" onclick="transpose(1)">♭/♯ +1</button>
      <button class="btn btn-secondary btn-small" onclick="transpose(-1)">♭/♯ -1</button>
      <button class="btn btn-secondary btn-small" id="btn-scroll" onclick="toggleAutoScroll()">📜 Auto Scroll</button>
    </div>

    <div id="view-chords" class="song-chords"></div>
    <div id="view-lyrics" class="song-lyrics"></div>
  </div>

  <!-- WIDOK DODAWANIA / EDYCJI POJEDYNCZEGO -->
  <div id="view-form" class="hidden">
    <div class="nav-bar">
      <button class="btn btn-secondary btn-small" onclick="showView('view-home')">⬅️ Anuluj</button>
      <h2 id="form-header">Dodaj Utwór</h2>
    </div>

    <input type="hidden" id="form-id">
    <input type="text" id="form-title" class="input-field" placeholder="Tytuł utworu *">
    <input type="text" id="form-category" class="input-field" placeholder="Kategoria (np. Uwielbienie, Kolędy)">
    <input type="text" id="form-audio-url" class="input-field" placeholder="Link do nagrania (Vocaroo / MP3)">
    <textarea id="form-lyrics" class="input-field" placeholder="Tekst pieśni *"></textarea>
    <textarea id="form-chords" class="input-field" placeholder="Akordy (opcjonalnie)"></textarea>

    <button class="btn btn-filled" onclick="saveSong()">💾 Zapisz</button>
    <button class="btn btn-danger hidden" id="btn-delete" onclick="deleteCurrentSong()">🗑️ Usuń Utwór</button>
  </div>

  <!-- WIDOK DODAWANIA MASOWEGO -->
  <div id="view-bulk" class="hidden">
    <div class="nav-bar">
      <button class="btn btn-secondary btn-small" onclick="showView('view-home')">⬅️ Anuluj</button>
      <h2>Masowe dodawanie</h2>
    </div>

    <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 10px;">
      Format (tytuł zaczyna się od cudzysłowu):<br>
      <code style="color: var(--primary);">"Nazwa Pieśni" [Kategoria]</code><br>
      <code style="color: var(--primary);"># Tekst</code><br>
      <code style="color: var(--primary);">Linijka tekstu...</code><br>
      <code style="color: var(--primary);"># Akordy</code><br>
      <code style="color: var(--primary);">G D e C</code>
    </p>

    <textarea id="form-bulk-text" class="input-field" placeholder="&quot;Nazwa Pieśni&quot; [Uwielbienie]&#10;# Tekst&#10;Tekst pieśni...&#10;&#10;# Akordy&#10;G D e C"></textarea>

    <button class="btn btn-filled" onclick="processBulkImport()">📥 Importuj wszystko</button>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    projectId: "spiewnik-psie-pole"
  };

  let db = null;
  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
  } catch (e) {
    console.warn("Błąd inicjalizacji Firebase:", e);
  }

  let songs = JSON.parse(localStorage.getItem('spiewnik_songs') || '[]');
  let archives = JSON.parse(localStorage.getItem('spiewnik_archives') || '[]');
  let repertuarIds = JSON.parse(localStorage.getItem('spiewnik_repertuar') || '[]');

  let activeCategory = 'Wszystkie';
  let currentSongId = null;
  let previousView = 'view-home';
  let scrollInterval = null;
  let isScrolling = false;

  const ADMIN_PIN = "1234";
  const chromaticScale = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

  const savedTheme = localStorage.getItem('spiewnik_theme') || 'dark';
  if (savedTheme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('theme-btn').innerText = "🌙 Ciemny";
  }

  window.toggleTheme = function() {
    const current = document.documentElement.getAttribute('data-theme');
    if (current === 'light') {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('spiewnik_theme', 'dark');
      document.getElementById('theme-btn').innerText = "☀️ Jasny";
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('spiewnik_theme', 'light');
      document.getElementById('theme-btn').innerText = "🌙 Ciemny";
    }
  };

  function checkAdminAccess() {
    const pin = prompt("Wprowadź kod PIN:");
    return pin === ADMIN_PIN;
  }

  async function fetchFromFirebase() {
    if (!db) return;
    try {
      const querySnapshot = await getDocs(collection(db, "songs"));
      if (!querySnapshot.empty) {
        const fetched = [];
        querySnapshot.forEach((docSnap) => {
          fetched.push({ id: docSnap.id, ...docSnap.data() });
        });
        songs = fetched;
        localStorage.setItem('spiewnik_songs', JSON.stringify(songs));
        renderAll();
      }
    } catch (e) {
      console.log("Błąd pobierania z Firebase:", e);
    }
  }

  window.showView = function(viewId) {
    stopAutoScroll();
    document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
    const target = document.getElementById(viewId);
    if (target) target.classList.remove('hidden');
  };

  function renderAll() {
    renderCategoryChips();
    renderSongsList();
    renderRepertuar();
    renderArchives();
  }

  function getUniqueCategories() {
    const cats = new Set();
    songs.forEach(s => { if (s.category) cats.add(s.category.trim()); });
    return Array.from(cats);
  }

  function renderCategoryChips() {
    const container = document.getElementById('categories-bar');
    if(!container) return;
    container.innerHTML = '';
    const categories = ['Wszystkie', ...getUniqueCategories()];

    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = `cat-chip ${activeCategory === cat ? 'active' : ''}`;
      btn.innerText = cat;
      btn.onclick = () => {
        activeCategory = cat;
        renderCategoryChips();
        renderSongsList();
      };
      container.appendChild(btn);
    });
  }

  function renderSongsList() {
    const container = document.getElementById('all-songs-list');
    if(!container) return;
    container.innerHTML = '';

    let filtered = songs;
    if (activeCategory !== 'Wszystkie') {
      filtered = songs.filter(s => (s.category || '') === activeCategory);
    }

    if (filtered.length === 0) {
      container.innerHTML = '<p style="color: var(--text-sub);">Brak utworów w tej kategorii.</p>';
      return;
    }

    filtered.forEach(song => container.appendChild(createSongRow(song)));
  }

  function renderRepertuar() {
    const container = document.getElementById('repertuar-list');
    if(!container) return;
    container.innerHTML = '';
    const list = songs.filter(s => repertuarIds.includes(s.id));

    if (list.length === 0) {
      container.innerHTML = '<p style="color: var(--text-sub);">Repertuar pusty.</p>';
      return;
    }

    list.forEach(song => container.appendChild(createSongRow(song)));
  }

  function renderArchives() {
    const container = document.getElementById('archive-list');
    if(!container) return;
    container.innerHTML = '';

    if (archives.length === 0) {
      container.innerHTML = '<p style="color: var(--text-sub);">Brak archiwów.</p>';
      return;
    }

    archives.forEach(arch => {
      const div = document.createElement('div');
      div.className = 'archive-item';
      div.innerHTML = `
        <div>
          <strong>${arch.name}</strong>
          <div style="font-size:0.8rem; color:var(--text-sub)">Pieśni: ${arch.songIds.length}</div>
        </div>
        <div>
          <button class="btn btn-secondary btn-small" onclick="loadArchive('${arch.id}')">📂</button>
          <button class="btn btn-danger btn-small" onclick="deleteArchive('${arch.id}')">🗑️</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function createSongRow(song) {
    const div = document.createElement('div');
    div.className = 'song-item';
    const inRep = repertuarIds.includes(song.id);
    const audioIcon = (song.audioUrl && song.audioUrl.trim() !== '') ? ' 🎵' : '';

    div.innerHTML = `
      <button class="song-title-btn" onclick="openSong('${song.id}')">
        ${song.title}${audioIcon} <span class="song-category">${song.category || 'Uwielbienie'}</span>
      </button>
      <button class="btn btn-secondary btn-small" onclick="toggleRepertuar('${song.id}')">
        ${inRep ? '➖' : '➕'}
      </button>
    `;
    return div;
  }

  window.openSong = function(id) {
    const song = songs.find(s => s.id === id);
    if (!song) return;

    currentSongId = id;
    
    if (!document.getElementById('view-songs').classList.contains('hidden')) previousView = 'view-songs';
    else if (!document.getElementById('view-repertuar').classList.contains('hidden')) previousView = 'view-repertuar';
    else previousView = 'view-home';

    document.getElementById('view-title').innerText = song.title;
    document.getElementById('view-category').innerText = song.category || 'Uwielbienie';
    document.getElementById('view-lyrics').innerText = song.lyrics || '';
    
    const chordsEl = document.getElementById('view-chords');
    chordsEl.innerText = song.chords || 'Brak akordów.';
    chordsEl.style.display = 'none';

    const audioContainer = document.getElementById('view-audio-container');
    const audioBtn = document.getElementById('view-audio-btn');
    
    if (song.audioUrl && song.audioUrl.trim() !== '') {
      audioBtn.href = song.audioUrl.trim();
      audioContainer.classList.remove('hidden');
    } else {
      audioBtn.href = '#';
      audioContainer.classList.add('hidden');
    }

    showView('view-single');
  };

  window.goBackFromSong = function() {
    showView(previousView);
  };

  window.toggleChords = function() {
    const el = document.getElementById('view-chords');
    el.style.display = (el.style.display === 'block') ? 'none' : 'block';
  };

  window.changeFontSize = function(delta) {
    const el = document.getElementById('view-lyrics');
    const size = parseFloat(window.getComputedStyle(el).fontSize);
    el.style.fontSize = (size + delta) + 'px';
  };

  window.transpose = function(steps) {
    const el = document.getElementById('view-chords');
    if (!el.innerText || el.innerText === 'Brak akordów.') return;
    
    el.innerText = el.innerText.replace(/[A-G][#b]?/g, (match) => {
      let idx = chromaticScale.indexOf(match);
      if (idx === -1) return match;
      let newIdx = (idx + steps) % 12;
      if (newIdx < 0) newIdx += 12;
      return chromaticScale[newIdx];
    });
  };

  window.toggleAutoScroll = function() {
    if (isScrolling) stopAutoScroll();
    else startAutoScroll();
  };

  function startAutoScroll() {
    isScrolling = true;
    document.getElementById('btn-scroll').innerText = "⏸️ Stop";
    scrollInterval = setInterval(() => {
      window.scrollBy(0, 1);
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight) stopAutoScroll();
    }, 40);
  }

  function stopAutoScroll() {
    isScrolling = false;
    clearInterval(scrollInterval);
    const btn = document.getElementById('btn-scroll');
    if (btn) btn.innerText = "📜 Auto Scroll";
  }

  window.toggleRepertuar = function(id) {
    if (repertuarIds.includes(id)) {
      repertuarIds = repertuarIds.filter(i => i !== id);
    } else {
      repertuarIds.push(id);
    }
    localStorage.setItem('spiewnik_repertuar', JSON.stringify(repertuarIds));
    renderAll();
  };

  window.saveRepertuarToArchive = function() {
    const input = document.getElementById('archive-name-input');
    const name = input.value.trim();
    if (!name || repertuarIds.length === 0) return alert("Wpisz nazwę zestawu!");

    archives.push({ id: Date.now().toString(), name, songIds: [...repertuarIds] });
    localStorage.setItem('spiewnik_archives', JSON.stringify(archives));
    input.value = '';
    renderAll();
  };

  window.loadArchive = function(id) {
    const arch = archives.find(a => a.id === id);
    if (!arch) return;
    repertuarIds = [...arch.songIds];
    localStorage.setItem('spiewnik_repertuar', JSON.stringify(repertuarIds));
    renderAll();
    showView('view-repertuar');
  };

  window.deleteArchive = function(id) {
    archives = archives.filter(a => a.id !== id);
    localStorage.setItem('spiewnik_archives', JSON.stringify(archives));
    renderAll();
  };

  window.filterSongs = function() {
    const q = document.getElementById('search-input').value.toLowerCase();
    document.querySelectorAll('#all-songs-list .song-item').forEach(row => {
      row.style.display = row.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
    });
  };

  window.openAddForm = function() {
    if (!checkAdminAccess()) return;
    document.getElementById('form-header').innerText = "Dodaj Utwór";
    document.getElementById('form-id').value = "";
    document.getElementById('form-title').value = "";
    document.getElementById('form-category').value = "";
    document.getElementById('form-audio-url').value = "";
    document.getElementById('form-lyrics').value = "";
    document.getElementById('form-chords').value = "";
    document.getElementById('btn-delete').classList.add('hidden');
    showView('view-form');
  };

  window.editCurrentSong = function() {
    if (!checkAdminAccess()) return;
    const song = songs.find(s => s.id === currentSongId);
    if (!song) return;

    document.getElementById('form-header').innerText = "Edytuj Utwór";
    document.getElementById('form-id').value = song.id;
    document.getElementById('form-title').value = song.title;
    document.getElementById('form-category').value = song.category || "";
    document.getElementById('form-audio-url').value = song.audioUrl || "";
    document.getElementById('form-lyrics').value = song.lyrics || "";
    document.getElementById('form-chords').value = song.chords || "";
    document.getElementById('btn-delete').classList.remove('hidden');
    showView('view-form');
  };

  window.saveSong = async function() {
    const id = document.getElementById('form-id').value;
    const title = document.getElementById('form-title').value.trim();
    const category = document.getElementById('form-category').value.trim() || "Uwielbienie";
    const audioUrl = document.getElementById('form-audio-url').value.trim();
    const lyrics = document.getElementById('form-lyrics').value.trim();
    const chords = document.getElementById('form-chords').value.trim();

    if (!title || !lyrics) return alert("Wypełnij tytuł oraz tekst utworu!");

    const songData = { title, category, audioUrl, lyrics, chords };

    if (id) {
      const idx = songs.findIndex(s => s.id === id);
      if (idx !== -1) songs[idx] = { ...songs[idx], ...songData };
      if (db && !id.startsWith("17")) {
        try { await updateDoc(doc(db, "songs", id), songData); } catch(e){console.error(e);}
      }
    } else {
      const newId = Date.now().toString();
      const newSong = { id: newId, ...songData };
      songs.push(newSong);
      if (db) {
        try { await addDoc(collection(db, "songs"), songData); } catch(e){console.error(e);}
      }
    }

    localStorage.setItem('spiewnik_songs', JSON.stringify(songs));
    renderAll();
    showView('view-songs');
  };

  window.deleteCurrentSong = async function() {
    if (!confirm("Na pewno usunąć ten utwór?")) return;
    const id = document.getElementById('form-id').value;
    
    songs = songs.filter(s => s.id !== id);
    repertuarIds = repertuarIds.filter(i => i !== id);
    
    localStorage.setItem('spiewnik_songs', JSON.stringify(songs));
    localStorage.setItem('spiewnik_repertuar', JSON.stringify(repertuarIds));

    if (db && !id.startsWith("17")) {
      try { await deleteDoc(doc(db, "songs", id)); } catch(e){console.error(e);}
    }

    renderAll();
    showView('view-songs');
  };

  window.openBulkForm = function() {
    if (!checkAdminAccess()) return;
    document.getElementById('form-bulk-text').value = "";
    showView('view-bulk');
  };

  window.processBulkImport = async function() {
    if (!checkAdminAccess()) return;
    const raw = document.getElementById('form-bulk-text').value;
    if (!raw.trim()) return alert("Wklej dane do importu!");

    // Dzielimy bloki po linijkach zaczynających się od cudzysłowu
    const blocks = raw.split(/(?=^")/gm);
    let count = 0;

    for (let block of blocks) {
      if (!block.trim()) continue;

      const lines = block.trim().split('\n');
      let firstLine = lines[0].trim();
      
      let title = "Bez tytułu";
      let category = "Uwielbienie";
      
      // Sprawdzamy czy linia zaczyna się od cudzysłowu i wyciągamy tytuł oraz kategorię
      const titleMatch = firstLine.match(/"([^"]+)"/);
      if (titleMatch) {
        title = titleMatch[1];
        let remainder = firstLine.replace(titleMatch[0], '').trim();
        const catMatch = remainder.match(/\[(.*?)\]|\((.*?)\)/);
        if (catMatch) {
          category = (catMatch[1] || catMatch[2]).trim();
        }
      } else {
        title = firstLine; // fallback
      }

      let lyricsArr = [];
      let chordsArr = [];
      let audioUrl = "";
      let currentMode = "lyrics";

      for (let i = 1; i < lines.length; i++) {
        let line = lines[i];
        let lower = line.trim().toLowerCase();

        if (lower.startsWith("# akordy")) {
          currentMode = "chords";
          continue;
        } else if (lower.startsWith("# tekst")) {
          currentMode = "lyrics";
          continue;
        } else if (lower.startsWith("# audio")) {
          audioUrl = line.replace(/^# audio\s*/i, '').trim();
          continue;
        }

        if (currentMode === "chords") {
          chordsArr.push(line);
        } else {
          lyricsArr.push(line);
        }
      }

      const newSongData = {
        title: title,
        category: category,
        audioUrl: audioUrl,
        lyrics: lyricsArr.join('\n').trim(),
        chords: chordsArr.join('\n').trim()
      };

      if (db) {
        try {
          await addDoc(collection(db, "songs"), newSongData);
        } catch (e) {
          console.error("Błąd zapisu do Firebase:", e);
        }
      }

      songs.push({ id: Date.now().toString() + Math.random(), ...newSongData });
      count++;
    }

    localStorage.setItem('spiewnik_songs', JSON.stringify(songs));
    alert(`Pomyślnie zaimportowano ${count} utworów!`);
    document.getElementById('form-bulk-text').value = '';
    renderAll();
    showView('view-songs');
  };

  fetchFromFirebase();
  renderAll();
</script>

</body>
